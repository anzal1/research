name: verify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qutrit-eaqecc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qutrit-eaqecc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: 14 seed codes (Hermitian self-orthogonal, exact distance)
        run: python check_seeds.py seeds.magma
      - name: 16 degenerate codes (exhaustive symplectic check)
        run: python check_degenerate.py
      - name: "[[14,3,8;5]]_3 stabilizer matrix"
        run: python check_eaqecc.py code_14_3_8_5.json

  kings-entropy-a247413:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kings-entropy-a247413
    steps:
      - uses: actions/checkout@v4
      - name: Install mpdecimal
        run: |
          if ! sudo apt-get install -y libmpdec-dev; then
            curl -sSL https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-4.0.0.tar.gz | tar xz
            (cd mpdecimal-4.0.0 && ./configure && make -j2 && sudo make install && sudo ldconfig)
          fi
      - name: Build
        run: cc -O2 compute_a247413.c -lmpdec -o compute_a247413
      - name: Run
        run: ./compute_a247413 | tee output.txt
      - name: Check the 26 digits
        run: |
          prefix=1.3426439511246012978517301
          for m in 18 20 22 24; do
            v=$(grep "m_max=$m:" output.txt | awk '{print $NF}')
            echo "m=$m  $v"
            case "$v" in
              $prefix*) ;;
              *) echo "m=$m does not start with $prefix"; exit 1 ;;
            esac
          done
          {
            echo "## A247413"
            echo '```'
            cat output.txt
            echo '```'
            echo "All of m = 18, 20, 22, 24 agree on the 26 digits $prefix"
          } >> "$GITHUB_STEP_SUMMARY"

  lean-qutrit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lean-qutrit
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean-toolchain)"
      - name: Fetch the locked mathlib build cache
        run: lake exe cache get $(awk '/^import Mathlib/{print $2}' Qutrit/Basic.lean Qmds/*.lean Shannon/*.lean Euler/*.lean)
      - name: Build and audit the final theorems
        run: |
          for file in Shannon/Cores/*.lean; do
            name=$(basename "$file" .lean)
            lake build "Shannon.Cores.$name"
          done
          lake build
          lake env lean Qutrit.lean | tee axioms.txt
          for theorem in witness_parameters distance_upper optimal_additive_distance; do
            grep -Fx "'Qutrit.$theorem' depends on axioms: [propext, Classical.choice, Quot.sound]" axioms.txt
          done
          lake env lean Qmds.lean | tee qmds-axioms.txt
          theorems=(
            AffinePuncture.all_affine_lengths
            TraceObstruction.monomial_has_root
            TraceObstruction.reciprocal_binomial_has_root
            Qmds.Order25.witness_exists
            Qmds.Order25.ball_vilar_family
            Qmds.Order25.ball_vilar_1024
            Qmds.FullLength.full_length_family
            Qmds.FullLength.full_length_1024
          )
          for theorem in "${theorems[@]}"; do
            grep -Fx "'$theorem' depends on axioms: [propext, Classical.choice, Quot.sound]" qmds-axioms.txt
          done
      - name: Audit and replay the seven-cycle projection obstruction
        run: |
          lake env lean Shannon.lean | tee shannon-axioms.txt
          grep -Fx "'Shannon.Seven.no_single_coordinate_extension' depends on axioms: [propext, Classical.choice, Quot.sound]" shannon-axioms.txt
          python3 -B ../shannon-seven/check_projection.py
      - name: Audit Euler's sixth-power subcase
        run: |
          lake env lean Euler.lean | tee euler-axioms.txt
          grep -Fx "'EulerSixth.lander_parkin' depends on axioms: [propext]" euler-axioms.txt
          grep -Fx "'EulerSixth.double_pair_sieve' depends on axioms: [propext, Classical.choice, Quot.sound]" euler-axioms.txt
          grep -Fx "'EulerSixth.double_pair_bound' depends on axioms: [propext, Classical.choice, Quot.sound]" euler-axioms.txt
          grep -Fx "'EulerSixth.triple_pair_impossible' depends on axioms: [propext, Classical.choice, Quot.sound]" euler-axioms.txt
      - name: Evaluate the order-25 witness over the entire field
        run: python3 -B Qmds/check_order25.py
      - name: Replay the two-term finite-field search
        run: |
          c++ -O3 -std=c++17 Qmds/search.cpp -o "$RUNNER_TEMP/qmds-search"
          "$RUNNER_TEMP/qmds-search" | grep -Fx '16581120 normalized candidates tested; each has a root'
      - name: Independent symplectic enumeration
        run: python3 -B check.py

  euler-sixth-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: euler-sixth
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check the eligible pairs and the complementary powers
        run: python3 -B check_coverage.py 100000000 | grep -Fx '17,144,501 eligible pairs through 100,000,000 by floor sums'
      - name: Replay the full search through one hundred million
        run: python3 -B search.py 100000000 | grep -Fx 'z <= 100,000,000; 17,144,501 eligible (z,a) pairs; 9,703 passed modular filters; witness = None'
